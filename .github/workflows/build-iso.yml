name: Build Andrey OS ISO

on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    tags: ["v*"]          # ao criar uma tag v1.0 etc., também gera a ISO

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Roda dentro de um Debian 13 (trixie) para o debootstrap/live-build
      # serem os mesmos da distro alvo.
      - name: Construir a ISO (Debian trixie, privilegiado)
        run: |
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -c "apt-get update && apt-get install -y sudo && ./build.sh"

      - name: Mostrar resultado
        if: always()
        run: |
          ls -lh *.iso || true
          tail -n 50 build.log || true

      - name: Gerar checksum
        run: sha256sum *.iso > SHA256SUMS

      - name: Publicar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: andrey-os-iso
          path: |
            *.iso
            SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Publicar log de build (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Anexar ISO à release (quando for tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS
